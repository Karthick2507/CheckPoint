# Example ETL pipeline: daily `request` extract -> validate -> transform ->
# validate -> load -> validate.
#
# Connections are referenced by name and resolved from config/connections/:
#   source.connection: mrm_presto        -> config/connections/mrm_presto.example.yml
#   target.connection: analytics_snowflake -> config/connections/analytics_snowflake.example.yml
#
# Run:
#   export PRESTO_AUTH_TOKEN=... SNOWFLAKE_PASSWORD=...
#   python -m cli run-pipeline --pipeline config/pipelines/request_daily.example.yml

pipeline:
  name: request_daily
  env: prod

  # How data moves:
  #   auto     (default) pushdown when source and target are the same
  #            connection, otherwise rows
  #   pushdown INSERT … SELECT run in the warehouse — no rows travel through
  #            Python, so cost is independent of row count. Use for
  #            same-warehouse work at TiB scale.
  #   rows     read into Python and INSERT … VALUES. Required for moving data
  #            BETWEEN systems (e.g. Presto -> Snowflake), as configured below.
  execution: auto

  # Variables available to every SQL template below, alongside the built-ins
  # {{ batch_id }}, {{ run_id }}, {{ pipeline }} and {{ env }}.
  # Rendering is strict: an unknown {{ name }} fails the stage rather than
  # silently rendering empty and scanning/returning the wrong rows.
  vars:
    min_duration: 0

  source:
    connection: mrm_presto
    table: mrm_log_flat.default.request
    batch_key: process_batch_id        # incremental filter key

    # Schema contract. Without this the extract is SELECT *, and an upstream
    # column addition, removal or reorder flows straight to the target with
    # nothing noticing. Declaring columns also renames them for the target, so
    # the projection and the mapping are one thing.
    # Accepts a list ([a, b]), a mapping (source: target), or {source:, as:}.
    columns:
      request__transaction_id: transaction_id
      request__event_time: event_time
      request__duration: duration
    # strict_columns: true  -> a row missing a declared column fails the run
    #                          rather than being written as a silent NULL.
    strict_columns: true

  extract:
    mode: incremental                  # full | incremental (WHERE process_batch_id = <batch_id>)
    limit: 100000

  # ELT: transform expressed as SQL run on the source (last SELECT = curated output).
  transform:
    - >
      SELECT
        request__transaction_id AS transaction_id,
        request__event_time     AS event_time,
        request__duration       AS duration
      FROM mrm_log_flat.default.request
      WHERE process_batch_id = '{{ batch_id }}'
        AND request__transaction_id IS NOT NULL

  target:
    connection: analytics_snowflake
    table: ANALYTICS.PUBLIC.REQUEST_CLEAN
    mode: merge                        # append | overwrite | merge | none
    keys: [transaction_id]

  # Three quality gates (warn-and-continue; severity tags drive the report).
  validate:
    raw: config/suites/request_raw.example.yml
    curated: config/suites/request_curated.example.yml
    post: config/suites/request_post.example.yml

  # Custom checks (native GE covers completeness + uniqueness in the suites).
  checks:
    - type: freshness
      target: mrm_log_flat.default.request
      timestamp_column: request__event_time
      # Scope to the batch: unscoped, MAX(ts) over the whole table finds any
      # fresher historical row and a month-old batch looks perfectly healthy.
      batch_key: process_batch_id
      max_lag_hours: 6
      severity: critical
    - type: volume_drift
      target: mrm_log_flat.default.request
      # Count THIS batch, not the whole table. On an append-only table the
      # total only grows, so an unscoped count can never see a failed batch
      # (100k historical rows + 0 new rows still counts ~100k).
      batch_key: process_batch_id
      tolerance: 0.25          # allowed deviation from the median baseline
      window: 5                # observations forming the baseline
      min_history: 3           # judge nothing until this many exist
      severity: warning
    - type: schema_drift
      target: mrm_log_flat.default.request
      severity: warning

  schedule: "0 6 * * *"                # cron-first: daily at 06:00
