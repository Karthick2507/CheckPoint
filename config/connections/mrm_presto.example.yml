# Presto/Trino connection for the ETL framework.
# Secrets come from the environment via ${VAR} interpolation.
#
#   export PRESTO_AUTH_TOKEN=cfeac6c3-...
#
# NOTE: reaching the production gateway requires VPN access.

connection:
  name: mrm_presto
  type: presto
  host: https://presto-gateway.presto.stg.aws.fwmrm.net:8080
  port: 8080
  user: kdhamotharan
  catalog: mrm_log_flat
  schema: default
  http_scheme: https
  request_timeout: 30
  auth_token: 62e2d855-c564-4d62-95b2-8636679ae6d8   # sent as "Authorization: Bearer <token>"
  auth_header: Authorization

  # Transient failures (gateway blips, dropped sockets, 503s) are retried with
  # exponential backoff + jitter. Reads retry; writes do not, because
  # re-issuing a partially applied INSERT is how duplicates get created.
  # Permanent failures (missing table, syntax error) never retry.
  retry_attempts: 3
  retry_initial_delay: 1
  retry_max_delay: 30
