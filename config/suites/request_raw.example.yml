# Gate 1 (raw): validate the source `request` table before transforming.
#
# Optional per-expectation fields:
#   id       stable identifier used to map a result back to this entry (and to
#            resolve its severity). Auto-assigned by position if omitted; set it
#            explicitly so reordering the list does not change report identity.
#   meta     arbitrary metadata carried through to the validation result.
suite:
  name: request_raw
  asset:
    type: table
    name: request
    table_name: mrm_log_flat.default.request
    # Narrow the gate to the run's batch. Without this every expectation
    # scans all history: a bad batch is diluted into billions of good rows,
    # uniqueness fails forever on historical duplicates, and each run
    # full-scans a TiB table. Use `batch_filter:` for anything a single
    # equality cannot express (it is templated, e.g. "{{ batch_id }}").
    batch_key: process_batch_id

expectations:
  - id: pk_exists
    type: expect_column_to_exist
    column: request__transaction_id
    severity: critical

  - id: pk_not_null
    type: expect_column_values_to_not_be_null
    column: request__transaction_id
    severity: critical
    meta:
      owner: data-engineering
