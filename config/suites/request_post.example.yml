# Gate 3 (post-load): validate the target table after loading.
suite:
  name: request_post
  asset:
    type: table
    name: request_clean
    table_name: ANALYTICS.PUBLIC.REQUEST_CLEAN
    # Validate the rows this run just loaded, not the whole target table.
    batch_key: process_batch_id

expectations:
  - type: expect_table_row_count_to_be_between
    min_value: 1
    severity: critical

  - type: expect_column_values_to_be_unique
    column: transaction_id
    severity: critical
