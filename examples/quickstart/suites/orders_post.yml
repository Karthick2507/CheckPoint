# Gate 3 (post-load): validate the TARGET after loading.
suite:
  name: orders_post
  asset:
    type: table
    name: orders_clean
    table_name: orders_clean

expectations:
  - id: target_not_empty
    type: expect_table_row_count_to_be_between
    min_value: 1
    severity: critical

  - id: target_id_unique
    type: expect_column_values_to_be_unique
    column: id
    severity: critical
